[project]
name = "logos"
version = "0.1.0"
description = "Logos marketplace SDK — specialist runner + trader client + x402 middleware"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "eth-account>=0.13",
    "web3>=7.4",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
