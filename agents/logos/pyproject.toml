[project]
name = "logos-arc"
version = "0.1.0"
description = "Logos marketplace SDK — agents buy and sell cognition on Arc, settled per query in USDC over x402 + EIP-3009"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enoch" }]
keywords = ["arc", "usdc", "x402", "eip-3009", "ai-agents", "marketplace", "nanopayments", "circle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "eth-account>=0.13",
    "web3>=7.4",
    "jsonschema>=4.23",
    "openai>=1.50",
]

[project.urls]
Homepage = "https://github.com/Enoch208/Logos"
Repository = "https://github.com/Enoch208/Logos"
Issues = "https://github.com/Enoch208/Logos/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
