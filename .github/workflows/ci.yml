name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts · foundry build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        working-directory: contracts
        run: forge build --sizes

      - name: forge test
        working-directory: contracts
        run: forge test -vvv

  indexer:
    name: indexer · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: npm ci
        working-directory: indexer
        run: npm ci

      - name: typecheck
        working-directory: indexer
        run: npm run typecheck

      - name: test
        working-directory: indexer
        run: npm test

  frontend:
    name: frontend · lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: test
        working-directory: frontend
        run: npm test

      - name: build
        working-directory: frontend
        run: npm run build

  agents:
    name: agents · pytest (mock-only + anvil E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agents/logos/pyproject.toml

      - name: Install Foundry (anvil + forge for E2E)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install logos (editable + dev deps)
        working-directory: agents
        run: pip install -e "logos[dev]"

      - name: pytest
        working-directory: agents
        run: pytest -v
